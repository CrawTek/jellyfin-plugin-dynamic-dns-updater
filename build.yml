name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dyndns-updater
          path: release/*
